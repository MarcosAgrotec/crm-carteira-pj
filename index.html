<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carteira PJ Agrotec</title>
<meta name="theme-color" content="#2f6b3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carteira PJ">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho fixo com abas; Painel = uma linha por cliente em ordem de prioridade; painel lateral/inferior para editar */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1b241d; --muted:#5f6b62; --line:#dde3dc;
  --accent:#2f6b3f; --accent-soft:#e4efe6; --accent-fg:#ffffff;
  --run:#1f5fa8; --run-soft:#e3edf9; --todo:#6b5d1f; --todo-soft:#f4efd9;
  --wait:#8a4a12; --wait-soft:#f8e9d8; --block:#a33a2b; --block-soft:#f8e4e0; --done:#5f6b62; --done-soft:#eceeeb;
  --font-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121713; --surface:#1a211c; --fg:#e6ece6; --muted:#9aa79d; --line:#2c362f;
  --accent:#6fbf83; --accent-soft:#1f3326; --accent-fg:#0d1a10;
  --run:#7fb1ee; --run-soft:#1a2a3d; --todo:#d9c26a; --todo-soft:#2d2a17;
  --wait:#f0b37a; --wait-soft:#35261a; --block:#ef8f80; --block-soft:#3a1f1b; --done:#9aa79d; --done-soft:#232a25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121713; --surface:#1a211c; --fg:#e6ece6; --muted:#9aa79d; --line:#2c362f;
  --accent:#6fbf83; --accent-soft:#1f3326; --accent-fg:#0d1a10;
  --run:#7fb1ee; --run-soft:#1a2a3d; --todo:#d9c26a; --todo-soft:#2d2a17;
  --wait:#f0b37a; --wait-soft:#35261a; --block:#ef8f80; --block-soft:#3a1f1b; --done:#9aa79d; --done-soft:#232a25; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.01em;margin:0;flex:1;min-width:0}
.brand small{font-weight:500;color:var(--muted);font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.tabs{display:flex;gap:4px;padding-block:8px 0}
.tab{font:600 15px var(--font-display);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
button{font-family:inherit}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--block);border:1px solid var(--block)}
.btn.sm{padding:6px 10px;font-size:13px}
:is(.btn,.tab,.chip,.card,select,input,textarea,.arrow,.act):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
.view{display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;color:var(--fg)}
.stat b{display:block;font:700 24px var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stat.alert b{color:var(--block)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.chip .n{color:var(--muted);margin-left:4px}
.search{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:14px}
.sep{width:1px;height:22px;background:var(--line)}
.totals{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.totals b{color:var(--fg)}
h2.group{font:600 13px var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 0;display:flex;gap:8px;align-items:center}
.list{display:flex;flex-direction:column;gap:8px}
/* linha do cliente no painel */
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:40px minmax(0,1fr);overflow:hidden}
.row.hot{border-left:4px solid var(--block)}
.prio{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line);background:var(--bg)}
.prio b{font:700 18px var(--font-display);font-variant-numeric:tabular-nums}
.arrow{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;line-height:1;padding:6px 10px}
.arrow:disabled{opacity:.25;cursor:default}
.rmain{padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;cursor:pointer;min-width:0}
.rname{font-weight:700;font-size:15.5px;min-width:0;overflow-wrap:anywhere}
.rinfo{font-size:12.5px;color:var(--muted);grid-column:1/-1;font-variant-numeric:tabular-nums}
.rnext{grid-column:1/-1;font-size:14px;min-width:0;overflow-wrap:anywhere}
.rnext .who{color:var(--muted)}
.rnext.wait{color:var(--wait)}
.rnext.none{color:var(--muted);font-style:italic}
.flags{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.flag{font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--block-soft);color:var(--block)}
.flag.soft{background:var(--wait-soft);color:var(--wait)}
.etapa{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:4px 12px;font:600 12px var(--font-body);cursor:pointer;align-self:start;max-width:46vw;text-overflow:ellipsis}
.e0{background:var(--done-soft);color:var(--muted)} .e1{background:var(--todo-soft);color:var(--todo)} .e2{background:var(--run-soft);color:var(--run)}
.e3{background:var(--accent-soft);color:var(--accent)} .e4{background:var(--wait-soft);color:var(--wait)} .e5{background:var(--accent);color:var(--accent-fg)}
.e6{background:var(--done-soft);color:var(--done)} .e7{background:var(--block-soft);color:var(--block)}
/* cartão de demanda */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;cursor:pointer;color:var(--fg);text-align:left;width:100%}
.card .cli{font:600 13px var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.card .task{font-weight:600;min-width:0}
.card .obs{color:var(--muted);font-size:14px;grid-column:1/-1;min-width:0;overflow-wrap:anywhere}
.card .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;align-items:center}
.meta .late{color:var(--block);font-weight:600}
.meta .soon{color:var(--todo);font-weight:600}
.meta .stale{color:var(--block)}
.acts{display:flex;gap:6px;margin-left:auto}
.act{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:4px 9px;font-size:12.5px;cursor:pointer;font-weight:600}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;align-self:start}
.s-run{background:var(--run-soft);color:var(--run)} .s-todo{background:var(--todo-soft);color:var(--todo)}
.s-wait{background:var(--wait-soft);color:var(--wait)} .s-done{background:var(--done-soft);color:var(--done)}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.empty{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.banner{background:var(--block-soft);color:var(--block);border-radius:10px;padding:10px 12px;font-size:14px}
.login{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.login h2{font:700 28px var(--font-display);margin:0}
.login p{color:var(--muted);margin:0;max-width:34ch}
.whoami{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding-block:0 4px;flex-wrap:wrap}
.whoami button{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:2px 4px;font-size:12.5px}
/* painel de edição */
.overlay{position:fixed;inset:0;background:rgba(10,15,11,.45);z-index:20;display:flex;justify-content:flex-end}
.panel{background:var(--surface);color:var(--fg);width:min(500px,100%);height:100%;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:12px}
.panel h3{font:700 20px var(--font-display);margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
label input,label select,label textarea{font:400 15px var(--font-body);text-transform:none;letter-spacing:0;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.actions .spacer{flex:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--block)}
.sub-h{font:600 13px var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0;display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sep{display:none}
  .overlay{align-items:flex-end}
  .panel{height:92%;border-radius:14px 14px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.card,.row,.chip{transition:border-color .15s,background .15s}.card:hover,.rmain:hover{background:var(--bg)}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1 class="brand">Carteira PJ <small>Agrotec</small></h1>
      <button class="btn" id="btnNew" type="button" hidden>+ Nova demanda</button>
    </div>
    <div class="tabs" role="tablist" hidden>
      <button class="tab" role="tab" id="tabPainel" aria-selected="true" type="button">Painel</button>
      <button class="tab" role="tab" id="tabDem" aria-selected="false" type="button">Demandas</button>
    </div>
    <div class="whoami" id="who" hidden><span id="whoMail"></span><button type="button" id="btnSair">Sair</button></div>
  </div>
</header>

<main class="wrap">
  <div id="banner" class="banner" hidden></div>
  <section id="viewLogin" class="login" hidden>
    <h2>Carteira PJ</h2>
    <p>Entre com a sua conta Google para ver e atualizar a carteira.</p>
    <button class="btn" id="btnEntrar" type="button">Entrar com Google</button>
  </section>

  <section id="viewPainel" class="view" hidden>
    <div class="filters" id="etapaChips"></div>
    <div class="filters">
      <input class="search" id="qc" type="search" placeholder="Buscar cliente, contato, banco ou gerente">
      <button class="btn ghost" id="btnNewCli" type="button">+ Novo cliente</button>
    </div>
    <div class="totals" id="totals"></div>
    <div class="note" id="importBox" hidden>Base vazia. Para trazer os dados da planilha, escolha o arquivo <b>importar-carteira-pj.json</b>:
      <input type="file" id="importFile" accept=".json,application/json" style="display:block;margin-top:8px"></div>
    <div id="cliList" class="list"><div class="empty">Carregando carteira…</div></div>
  </section>

  <section id="viewDem" class="view" hidden>
    <div class="stats" id="stats"></div>
    <div class="filters">
      <button class="chip" data-st="abertas" aria-pressed="true" type="button">Abertas</button>
      <button class="chip" data-st="concluidas" aria-pressed="false" type="button">Concluídas</button>
      <button class="chip" data-st="todas" aria-pressed="false" type="button">Todas</button>
      <span class="sep"></span>
      <button class="chip" data-resp="" aria-pressed="true" type="button">Todos</button>
      <button class="chip" data-resp="Marcos Carrera" aria-pressed="false" type="button">Marcos</button>
      <button class="chip" data-resp="Anderson Nascimento" aria-pressed="false" type="button">Anderson</button>
      <input class="search" id="q" type="search" placeholder="Buscar cliente, tarefa ou observação">
    </div>
    <div id="demList" class="list"><div class="empty">Carregando demandas…</div></div>
  </section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" hidden></div>
<datalist id="linhas"><option>FNO Empresarial</option><option>FNO Rural</option><option>Capital de giro</option><option>Investimento</option><option>Máquinas e equipamentos</option><option>Limite global</option></datalist>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const fs = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

const ETAPAS = ["Prospecção","Documentação","Cadastro/limite","Projeto","Análise no banco","Contratado","Pausado","Perdido"];
const ETAPA_CLS = e => ({"Prospecção":"e1","Documentação":"e1","Cadastro/limite":"e2","Projeto":"e3","Análise no banco":"e4","Contratado":"e5","Pausado":"e6","Perdido":"e7"}[e] || "e0");
// Prévia local (localhost/?demo): dados de demo.json só na memória, nada vai ao Firestore
const DEMO = location.hostname==="localhost" && new URLSearchParams(location.search).has("demo");
const ATIVA = e => !["Contratado","Pausado","Perdido"].includes(e);
const BANCOS = ["","BASA","Banco do Brasil","Bradesco","Sicredi","Sicoob","Cresol","Outro"];
const STATUS = ["A fazer","Fazendo","Aguardando","Concluída"];
const LEGADO = {"Não iniciada":"A fazer","Em execução":"Fazendo","Bloqueada":"Aguardando"};
const ns = s => LEGADO[s] || (STATUS.includes(s) ? s : "A fazer");
const ST_CLASS = {"A fazer":"s-todo","Fazendo":"s-run","Aguardando":"s-wait","Concluída":"s-done"};
const RESP = ["Marcos Carrera","Anderson Nascimento","Ambos"];
const curto = r => r==="Marcos Carrera"?"Marcos":r==="Anderson Nascimento"?"Anderson":(r||"sem responsável");
const state = {clientes:[], demandas:[], tab:"painel", etapa:"ativas", st:"abertas", resp:"", q:"", qc:"", loaded:{c:false,d:false}};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const addDays = (iso,n) => { const d=new Date((iso||todayISO())+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const fmt = iso => iso ? iso.slice(8,10)+"/"+iso.slice(5,7) : "";
const days = iso => Math.round((new Date(iso+"T00:00:00") - new Date(todayISO()+"T00:00:00"))/864e5);
const cliById = id => state.clientes.find(c => c.id===id);
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const brl = v => (v||v===0) && !isNaN(v) ? new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",notation:"compact",maximumFractionDigits:1}).format(v) : "";
// Aceita "2.500.000", "2.500.000,00", "2,5 mi", "2,5 milhões", "800 mil", "800k"
function parseValor(s){
  s=String(s||"").toLowerCase().replace(/r\$|\s/g,""); if(!s) return null;
  let mult=1;
  if (/(mi|milh[aã]o|milh[oõ]es|m)$/.test(s)){ mult=1e6; s=s.replace(/(mi|milh[aã]o|milh[oõ]es|m)$/,""); }
  else if (/(mil|k)$/.test(s)){ mult=1e3; s=s.replace(/(mil|k)$/,""); }
  if (s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  if (!/^\d+(\.\d+)?$/.test(s)) return null;
  return Math.round(parseFloat(s)*mult*100)/100;
}

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2400); }
function banner(msg){ const b=$("#banner"); b.textContent=msg; b.hidden=!msg; }

/* ---------- regras do painel ---------- */
const abertas = cid => state.demandas.filter(d=>d.clienteId===cid && ns(d.status)!=="Concluída");
function rank(d){ const s=ns(d.status); if(d.prazo && days(d.prazo)<0) return 0; if(s==="Aguardando") return 4; if(d.prazo) return 1; return s==="Fazendo"?2:3; }
function proximo(cid){
  return abertas(cid).sort((a,b)=>rank(a)-rank(b)||(a.prazo||"9").localeCompare(b.prazo||"9")||(b.atualizado||"").localeCompare(a.atualizado||""))[0];
}
function ultimoToque(c){
  return [c.atualizado, ...state.demandas.filter(d=>d.clienteId===c.id).map(d=>d.atualizado)].filter(Boolean).sort().pop() || "";
}
const ordenados = () => [...state.clientes].sort((a,b)=>(a.prioridade??99)-(b.prioridade??99)||a.nome.localeCompare(b.nome));

/* ---------- render: painel ---------- */
function renderChips(){
  const cont = e => state.clientes.filter(c=>(c.etapa||"")===e).length;
  const ativas = state.clientes.filter(c=>ATIVA(c.etapa||"")).length;
  const chips = [["ativas","Em andamento",ativas], ...ETAPAS.map(e=>[e,e,cont(e)]), ["todas","Todas",state.clientes.length]];
  const semEtapa = cont("");
  if (semEtapa) chips.splice(1,0,["","Sem etapa",semEtapa]);
  $("#etapaChips").innerHTML = chips.filter(([k,,n])=>n||k==="ativas"||k==="todas"||k===state.etapa)
    .map(([k,l,n])=>`<button class="chip" type="button" data-etapa="${esc(k)}" aria-pressed="${k===state.etapa}">${esc(l)}<span class="n">${n}</span></button>`).join("");
}
function filtraEtapa(c){
  const e=c.etapa||"";
  if (state.etapa==="todas") return true;
  if (state.etapa==="ativas") return ATIVA(e);
  return e===state.etapa;
}
function cliRow(c, i, lista){
  const nx = proximo(c.id);
  const e = c.etapa||"";
  const flags = [];
  if (nx && nx.prazo && days(nx.prazo)<0) flags.push(`<span class="flag">Atrasado ${-days(nx.prazo)}d</span>`);
  const ut = ultimoToque(c);
  if (ATIVA(e) && ut && -days(ut)>30) flags.push(`<span class="flag soft">Parado há ${-days(ut)}d</span>`);
  let next;
  if (!nx) next = `<div class="rnext none">${ATIVA(e)?"Sem próximo passo definido":"Nenhuma demanda aberta"}</div>`;
  else if (ns(nx.status)==="Aguardando") next = `<div class="rnext wait">⏳ Aguardando ${esc(nx.aguardando||"retorno")} · ${esc(nx.tarefa)}</div>`;
  else next = `<div class="rnext">▸ ${esc(nx.tarefa)} <span class="who">· ${esc(curto(nx.responsavel))} · ${nx.prazo?"até "+fmt(nx.prazo):"sem data"}</span></div>`;
  if (ATIVA(e) && !nx) flags.push(`<span class="flag">Sem próximo passo</span>`);
  const info = [[c.banco,c.linha].filter(Boolean).join(" · "), brl(c.valor), c.gerente&&("Gerente: "+c.gerente)].filter(Boolean).map(esc).join("  ·  ");
  const n = abertas(c.id).length;
  return `<div class="row${flags.some(f=>!f.includes("soft"))&&ATIVA(e)?" hot":""}">
    <div class="prio">
      <button class="arrow" type="button" data-up="${esc(c.id)}" aria-label="Subir prioridade" ${i===0?"disabled":""}>▲</button>
      <b>${c.prioridade??"–"}</b>
      <button class="arrow" type="button" data-down="${esc(c.id)}" aria-label="Descer prioridade" ${i===lista.length-1?"disabled":""}>▼</button>
    </div>
    <div class="rmain" data-cli="${esc(c.id)}" tabindex="0" role="button">
      <span class="rname">${esc(c.nome)}</span>
      <select class="etapa ${ETAPA_CLS(e)}" data-etapa-de="${esc(c.id)}" aria-label="Etapa de ${esc(c.nome)}">
        ${e?"":"<option value='' selected>Definir etapa</option>"}${ETAPAS.map(x=>`<option${x===e?" selected":""}>${x}</option>`).join("")}
      </select>
      ${info?`<div class="rinfo">${info}</div>`:""}
      ${next}
      <div class="flags">${flags.join("")}${n>1?`<span class="flag soft" style="background:var(--done-soft);color:var(--muted)">${n} abertas</span>`:""}</div>
    </div>
  </div>`;
}

/* ---------- render: demandas ---------- */
function respMatch(d){ return !state.resp || d.responsavel===state.resp || d.responsavel==="Ambos"; }
function renderStats(){
  const open = state.demandas.filter(d=>ns(d.status)!=="Concluída" && respMatch(d));
  const late = open.filter(d=>d.prazo && days(d.prazo)<0).length;
  const week = open.filter(d=>d.prazo && days(d.prazo)>=0 && days(d.prazo)<=7).length;
  $("#stats").innerHTML = [["Em aberto",open.length,""],["Próx. 7 dias",week,""],["Aguardando",open.filter(d=>ns(d.status)==="Aguardando").length,""],["Atrasadas",late,late?"alert":""]]
    .map(([l,n,c])=>`<div class="stat ${c}"><b>${n}</b><span>${l}</span></div>`).join("");
}
function demCard(d, mostraCli=true){
  const c = cliById(d.clienteId), s = ns(d.status);
  const meta = [esc(curto(d.responsavel))];
  if (s==="Aguardando" && d.aguardando) meta.push(`Aguardando ${esc(d.aguardando)}`);
  if (d.prazo && s!=="Concluída"){
    const n=days(d.prazo);
    meta.push(n<0?`<span class="late">Atrasada ${-n}d · ${fmt(d.prazo)}</span>`:n<=7?`<span class="soon">Prazo ${n===0?"hoje":"em "+n+"d"} · ${fmt(d.prazo)}</span>`:`Prazo ${fmt(d.prazo)}`);
  }
  if (d.atualizado){ const n=-days(d.atualizado); meta.push(`<span class="${n>30&&s!=="Concluída"?"stale":""}">Atualizada ${fmt(d.atualizado)}${n>0?" ("+n+"d)":""}</span>`); }
  const acts = s==="Concluída" ? "" : `<span class="acts"><button class="act" type="button" data-act="mais7" data-id="${esc(d.id)}" title="Adiar o prazo em 7 dias">+7 dias</button><button class="act" type="button" data-act="concluir" data-id="${esc(d.id)}">✓ Concluir</button></span>`;
  return `<div class="card" role="button" tabindex="0" data-dem="${esc(d.id)}">
    <div style="min-width:0">${mostraCli?`<div class="cli">${esc(c?c.nome:"Cliente removido")}</div>`:""}<div class="task">${esc(d.tarefa||"(sem título)")}</div></div>
    <span class="pill ${ST_CLASS[s]}">${s}</span>
    ${d.obs?`<div class="obs">${esc(d.obs)}</div>`:""}
    <div class="meta">${meta.join("<span aria-hidden='true'>·</span>")}${acts}</div>
  </div>`;
}
function sortDem(a,b){
  const pa=a.prazo||"9999", pb=b.prazo||"9999";
  if (pa!==pb) return pa<pb?-1:1;
  return (cliById(a.clienteId)?.prioridade??99)-(cliById(b.clienteId)?.prioridade??99);
}
function renderDem(){
  renderStats();
  if (!state.loaded.d || !state.loaded.c) return;
  const el=$("#demList");
  let list = state.demandas.filter(respMatch);
  if (state.st==="abertas") list=list.filter(d=>ns(d.status)!=="Concluída");
  if (state.st==="concluidas") list=list.filter(d=>ns(d.status)==="Concluída");
  if (state.q){ const q=norm(state.q); list=list.filter(d=>norm([cliById(d.clienteId)?.nome,d.tarefa,d.obs,d.aguardando].join(" ")).includes(q)); }
  if (!state.demandas.length){ el.innerHTML=`<div class="empty">Nenhuma demanda ainda.<br>Toque em <b>+ Nova demanda</b>.</div>`; return; }
  if (!list.length){ el.innerHTML=`<div class="empty">Nada com esses filtros.</div>`; return; }
  const late = list.filter(d=>ns(d.status)!=="Concluída" && d.prazo && days(d.prazo)<0).sort(sortDem);
  const rest = list.filter(d=>!late.includes(d));
  let html = late.length ? `<h2 class="group" style="color:var(--block)">Atrasadas ${late.length}</h2>`+late.map(d=>demCard(d)).join("") : "";
  for (const g of ["Fazendo","A fazer","Aguardando","Concluída"]){
    const items=rest.filter(d=>ns(d.status)===g).sort(g==="Concluída"?(a,b)=>(b.atualizado||"").localeCompare(a.atualizado||""):sortDem);
    if (items.length) html+=`<h2 class="group">${g} ${items.length}</h2>`+items.map(d=>demCard(d)).join("");
  }
  el.innerHTML=html;
}
function render(){ state.tab==="painel"?renderPainel():renderDem(); if(!$("#overlay").hidden && openCli) refreshCliPanel(); }

/* ---------- gravação ---------- */
function mem(coll, id, body, modo){
  const arr=state[coll], i=arr.findIndex(x=>x.id===id);
  if (modo==="del"){ if(i>=0) arr.splice(i,1); }
  else if (modo==="patch"){ if(i>=0) arr[i]={...arr[i],...body}; }
  else { const nid=id||("m"+Date.now()); if(i>=0) arr[i]={id:nid,...body}; else arr.push({id:nid,...body}); }
  render(); return true;
}
async function save(coll, id, body, okMsg){
  if (DEMO){ toast(okMsg+" (prévia)"); return mem(coll,id,body,"set"); }
  try{
    if (id) await setDoc(doc(fs, coll, id), body); else await addDoc(collection(fs, coll), body);
    toast(okMsg); return true;
  }catch(e){ handleErr(e); return false; }
}
async function patch(coll, id, body, okMsg){
  if (DEMO){ if (okMsg) toast(okMsg+" (prévia)"); return mem(coll,id,body,"patch"); }
  try{ await updateDoc(doc(fs, coll, id), body); if (okMsg) toast(okMsg); return true; }catch(e){ handleErr(e); return false; }
}
async function remove(coll, id, okMsg){
  if (DEMO){ toast(okMsg+" (prévia)"); return mem(coll,id,null,"del"); }
  try{ await deleteDoc(doc(fs, coll, id)); toast(okMsg); return true; }catch(e){ handleErr(e); return false; }
}
function handleErr(e){
  console.error(e);
  if (e && e.code==="permission-denied") banner("Este e-mail não tem permissão para gravar no CRM.");
  else if (e && e.code==="resource-exhausted") toast("Limite gratuito do dia atingido");
  else toast("Não gravou. Tente de novo.");
}
async function moverPrioridade(id, dir){
  const lista = ordenados();
  const visiveis = [...$("#cliList").querySelectorAll("[data-cli]")].map(el=>el.dataset.cli);
  const pos = visiveis.indexOf(id), alvo = visiveis[pos+dir];
  if (!alvo) return;
  const a = lista.findIndex(c=>c.id===id), b = lista.findIndex(c=>c.id===alvo);
  [lista[a], lista[b]] = [lista[b], lista[a]];
  if (DEMO){ lista.forEach((c,i)=>{ c.prioridade=i+1; }); return render(); }
  const batch = writeBatch(fs); let n=0;
  lista.forEach((c,i)=>{ if (c.prioridade!==i+1){ batch.update(doc(fs,"clientes",c.id),{prioridade:i+1}); n++; } });
  try{ if (n) await batch.commit(); }catch(e){ handleErr(e); }
}

}
function checkImport(){ $("#importBox").hidden = !(state.loaded.c && state.loaded.d && !state.clientes.length && !state.demandas.length); }
$("#btnEntrar").onclick = async ()=>{
  const p = new GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
  try{ await signInWithPopup(auth, p); }
  catch(e){ if (e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment") signInWithRedirect(auth,p); else if (e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request") toast("Não entrou: "+e.code); }
};
$("#btnSair").onclick = ()=>signOut(auth);

if (DEMO){
  fetch("demo.json").then(r=>r.json()).then(data=>{
    state.clientes=data.clientes; state.demandas=data.demandas; state.loaded={c:true,d:true};
    $("#whoMail").textContent="PRÉVIA LOCAL · nada é gravado"; showApp(true);
  }).catch(()=>banner("Prévia: falta o arquivo demo.json na pasta do site."));
}
onAuthStateChanged(auth, user=>{
  if (DEMO) return;
  unsubs.forEach(u=>u()); unsubs=[];
  state.clientes=[]; state.demandas=[]; state.loaded={c:false,d:false};
  banner("");
  if (!user){ showApp(false); return; }
  $("#whoMail").textContent=user.email; showApp(true);
  for (const [coll,key] of [["clientes","c"],["demandas","d"]]){
    unsubs.push(onSnapshot(collection(fs, coll), snap=>{
      state[coll]=snap.docs.map(d=>({id:d.id,...d.data()}));
      state.loaded[key]=true; render(); checkImport();
    }, e=>{
      $("#cliList").innerHTML=""; $("#demList").innerHTML="";
      if (e.code==="permission-denied") banner(`A conta ${user.email} não tem acesso a este CRM. Toque em Sair e entre com a conta liberada.`);
      else banner("A conexão com os dados caiu. Recarregue a página.");
    }));
  }
});

$("#importFile").addEventListener("change", async e=>{
  const f=e.target.files[0]; if(!f || DEMO) return;
  try{
    const data=JSON.parse(await f.text());
    const b=writeBatch(fs);
    for (const coll of ["clientes","demandas"]) for (const {id,...body} of (data[coll]||[])) b.set(doc(fs,coll,id),body);
    await b.commit();
    toast(`Importados ${data.clientes.length} clientes e ${data.demandas.length} demandas`);
  }catch(err){ toast("Arquivo inválido ou sem permissão"); console.error(err); }
});
</script>
</body>
</html>
